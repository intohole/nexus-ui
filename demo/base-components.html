<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>nexus-ui 基础组件演示</title>
<script src="https://registry.npmmirror.com/vue/3.4.21/files/dist/vue.global.prod.js"></script>
<link rel="stylesheet" href="../css/nexus-all.css">
<style>
  body { margin: 0; }
  .demo-wrap { max-width: 960px; margin: 32px auto 0; padding: 0 24px 120px; }
  .demo-title { font-size: 28px; font-weight: 700; color: var(--nx-text-heading); margin: 0 0 4px; }
  .demo-sub { color: var(--nx-text-secondary); font-size: 14px; margin: 0 0 28px; }
  .demo-viewport { width: 100%; height: 44px; background: var(--nx-bg-muted); border-radius: 12px; margin-bottom: 24px; }
  .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .cell { padding: 16px; background: var(--nx-bg-muted); border-radius: 12px; text-align: center; font-size: 13px; color: var(--nx-text-secondary); }
  .cell-tall { height: 900px; }
</style>
</head>
<body>
<div id="app" v-cloak>
  <div class="demo-wrap">
    <h1 class="demo-title">nexus-ui 基础组件</h1>
    <p class="demo-sub">统一基础控件 · 多端适配内置 · 桌面优先 · 深蓝灰石板色系</p>

    <nux-section title="按钮" description="variant / size / loading / block，触屏自动 44px 命中区">
      <div class="row">
        <nux-button @click="log('primary')">主要操作</nux-button>
        <nux-button variant="ghost">次要操作</nux-button>
        <nux-button variant="danger">危险操作</nux-button>
        <nux-button variant="text">文字按钮</nux-button>
        <nux-button :loading="busy" @click="busy = !busy">加载中</nux-button>
        <nux-button disabled>禁用</nux-button>
        <nux-button size="sm">小按钮</nux-button>
        <nux-button size="lg">大按钮</nux-button>
      </div>
    </nux-section>

    <nux-section title="输入控件" description="v-model 统一，移动端 16px 字号防 iOS 缩放">
      <div style="max-width: 420px">
        <nux-input v-model="name" label="名称" placeholder="请输入名称" clearable required :maxlength="20" hint="不超过 20 个字" :error="nameError">
          <template #prefix>@</template>
        </nux-input>
        <nux-textarea v-model="bio" label="简介" :rows="3" :auto-resize="true" :maxlength="120" placeholder="介绍一下自己"></nux-textarea>
        <nux-select v-model="city" label="城市" :options="cities" placeholder="请选择城市"></nux-select>
        <nux-search-box v-model="kw" @search="log('search: ' + kw)"></nux-search-box>
        <nux-switch v-model="notify" label="接收通知" description="重要进展会第一时间告诉你"></nux-switch>
        <nux-switch v-model="dark"></nux-switch>
        <div class="row" style="margin-top: 8px">
          <nux-checkbox v-model="agree" label="我已阅读并同意服务条款"></nux-checkbox>
        </div>
      </div>
    </nux-section>

    <nux-section title="选择与导航" description="分段控件滑动指示器 / 标签多选 / 步骤条">
      <nux-segmented v-model="tab" :options="tabs"></nux-segmented>
      <p style="font-size: 13px; color: var(--nx-text-muted); margin: 12px 0 20px">当前分段：{{ tab }}</p>
      <nux-chip-group v-model="tags" :options="tagOptions" :multiple="true"></nux-chip-group>
      <div style="height: 20px"></div>
      <nux-steps :items="steps" :current="step"></nux-steps>
      <div class="row" style="margin-top: 16px">
        <nux-button size="sm" variant="ghost" @click="step = Math.max(step - 1, 0)">上一步</nux-button>
        <nux-button size="sm" @click="step = Math.min(step + 1, 3)">下一步</nux-button>
      </div>
    </nux-section>

    <nux-section title="进度与状态" description="线性 / 环形进度，行内与块级加载">
      <div style="max-width: 420px; margin-bottom: 20px">
        <nux-progress :value="pct" label="同步进度" status="success"></nux-progress>
      </div>
      <div class="row">
        <nux-progress type="circle" :value="66"></nux-progress>
        <nux-progress type="circle" :value="100" status="success" size="56" :stroke-width="6"></nux-progress>
        <nux-loading text="加载中"></nux-loading>
        <nux-loading size="sm" :inline="true"></nux-loading>
      </div>
    </nux-section>

    <nux-section title="折叠面板">
      <nux-accordion v-model="acc" :items="faqs">
        <template #item-0="{ item }">
          <p>自定义插槽内容：{{ item.content }}</p>
        </template>
      </nux-accordion>
    </nux-section>

    <nux-section title="响应式栅格" description="桌面 3 列 / 平板与移动端自动单列，适配收口在中间件">
      <nux-grid :cols="3">
        <div v-for="i in 6" :key="i" class="cell">栅格 {{ i }}</div>
      </nux-grid>
      <div style="height: 16px"></div>
      <nux-grid min="180px">
        <div v-for="i in 4" :key="i" class="cell">自适应 {{ i }}</div>
      </nux-grid>
    </nux-section>

    <nux-section title="事件日志" description="按钮 / 搜索 / 复选等交互输出">
      <p style="font-size: 13px; color: var(--nx-text-secondary); margin: 0; min-height: 20px" id="demo-log">{{ logText || '（点击上方组件试试）' }}</p>
    </nux-section>

    <div class="cell-tall"></div>
  </div>
  <nux-backtop :threshold="200"></nux-backtop>
</div>

<script src="../js/components/nux-button.js"></script>
<script src="../js/components/nux-input.js"></script>
<script src="../js/components/nux-textarea.js"></script>
<script src="../js/components/nux-select.js"></script>
<script src="../js/components/nux-switch.js"></script>
<script src="../js/components/nux-checkbox.js"></script>
<script src="../js/components/nux-search-box.js"></script>
<script src="../js/components/nux-segmented.js"></script>
<script src="../js/components/nux-chip-group.js"></script>
<script src="../js/components/nux-steps.js"></script>
<script src="../js/components/nux-progress.js"></script>
<script src="../js/components/nux-loading.js"></script>
<script src="../js/components/nux-accordion.js"></script>
<script src="../js/components/nux-grid.js"></script>
<script src="../js/components/nux-section.js"></script>
<script src="../js/components/nux-backtop.js"></script>
<script>
const app = Vue.createApp({
  data() {
    return {
      name: '',
      bio: '',
      city: '',
      kw: '',
      agree: true,
      notify: true,
      dark: false,
      busy: true,
      nameError: '',
      tab: 'day',
      tabs: [
        { label: '今日', value: 'day' },
        { label: '本周', value: 'week' },
        { label: '本月', value: 'month' },
        { label: '全部', value: 'all' }
      ],
      tags: ['写作'],
      tagOptions: [
        { label: '写作', value: '写作' },
        { label: '学习', value: '学习' },
        { label: '理财', value: '理财' },
        { label: '健康', value: '健康' }
      ],
      step: 1,
      steps: [
        { title: '选择场景', desc: '确认目标' },
        { title: '补充信息', desc: '关键细节' },
        { title: '确认生成', desc: '一键生成' },
        { title: '查看成果', desc: '编辑导出' }
      ],
      pct: 66,
      acc: 0,
      faqs: [
        { title: '多端适配谁来做？', content: '适配工作收口在 nexus-ui 中间件，业务项目不写媒体查询：桌面优先布局，820px 以下自动单列，触屏自动放大命中区。' },
        { title: '如何切换主题色？', content: '在 body 上添加应用 class（如 app-one-note），全部组件跟随 --app-accent 变量联动。' },
        { title: '组件如何引入？', content: 'nexus-all.css 已包含全部样式，按需引入对应的 nux-*.js 并注册组件即可。' }
      ],
      logText: ''
    };
  },
  watch: {
    name(v) {
      this.nameError = v.length > 0 && v.length < 2 ? '名称至少 2 个字符' : '';
    }
  },
  methods: {
    log(msg) {
      this.logText = msg;
    }
  },
  mounted() {
    setInterval(() => { this.pct = this.pct >= 100 ? 0 : this.pct + 17; }, 2500);
  }
});
[
  ['nux-button', 'NuxButton'], ['nux-input', 'NuxInput'], ['nux-textarea', 'NuxTextarea'],
  ['nux-select', 'NuxSelect'], ['nux-switch', 'NuxSwitch'], ['nux-checkbox', 'NuxCheckbox'],
  ['nux-search-box', 'NuxSearchBox'], ['nux-segmented', 'NuxSegmented'], ['nux-chip-group', 'NuxChipGroup'],
  ['nux-steps', 'NuxSteps'], ['nux-progress', 'NuxProgress'], ['nux-loading', 'NuxLoading'],
  ['nux-accordion', 'NuxAccordion'], ['nux-grid', 'NuxGrid'], ['nux-section', 'NuxSection'],
  ['nux-backtop', 'NuxBacktop']
].forEach(([tag, name]) => {
  if (window[name]) app.component(tag, window[name]);
  else console.error('组件缺失:', name);
});
app.mount('#app');
</script>
</body>
</html>
