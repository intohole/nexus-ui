<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>nux-app-switcher 演示</title>
<script src="https://registry.npmmirror.com/vue/3.4.21/files/dist/vue.global.prod.js"></script>
<style>
  body{margin:0;background:linear-gradient(160deg,#eef2f7,#f8fafc);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  .mock-top{height:56px;background:#fff;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;padding:0 24px;gap:10px;box-shadow:0 1px 3px rgba(15,23,42,.04)}

  .mock-title{font-weight:600;color:#1e293b}
  .mock-wrap{max-width:680px;margin:48px auto;padding:0 20px}
  .mock-h1{font-size:24px;font-weight:700;color:#0f172a;margin:0 0 8px}
  .mock-p{color:#64748b;font-size:14px;line-height:1.7;margin:0 0 20px}
  .mock-card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:20px;box-shadow:0 4px 16px rgba(15,23,42,.05)}
  .tip{position:fixed;right:18px;top:16px;z-index:5;background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:10px 14px;font-size:13px;color:#475569;box-shadow:0 6px 18px rgba(15,23,42,.1)}
  .tip b{color:#0ea5e9}
</style>
</head>
<body>
  <header class="mock-top">
    <span class="mock-brand">汇</span>
    <span class="mock-title">汇报通 · 演示业务站</span>
  </header>
  <div class="tip">左下角 <b>松果氪</b> 即为跨应用导航入口，点击打开 →</div>
  <main class="mock-wrap">
    <h1 class="mock-h1">这是一个业务应用</h1>
    <p class="mock-p">本页模拟任意一个业务站（浅色 nexus-ui 风格）。左侧漂浮的「松果氪」即收归到中间件的跨应用导航条，任何业务页只需引入一个脚本即可获得整站产品族入口：回主站、切换其他应用，按分类分组 + 最近使用智能置顶 + 关键词搜索。</p>
    <div class="mock-card">这里可以是任意业务内容。导航条用深蓝灰石板玻璃 + 天空蓝点缀，代表"松果氪产品族"，在浅色业务站里自然形成品牌层级，一致且不冲突。</div>
  </main>
