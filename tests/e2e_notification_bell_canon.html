<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>S212 bell 缺省 canon E2E</title>
  <link rel="stylesheet" href="/css/nexus-all.css">
  <script src="/vendor/vue.global.prod.js"></script>
  <script src="/js/nexus-all.js"></script>
  <script src="/js/components/nux-notification-bell.js"></script>
  <style>
    .e2e-bell-dock { position: fixed; top: 24px; right: 32px; z-index: 20; }
  </style>
</head>
<body>
  <div id="app"><div class="e2e-bell-dock"><nux-notification-bell></nux-notification-bell></div></div>
  <script>
    localStorage.setItem('uc_access_token', 'e2e-canon-token');
    const app = Vue.createApp({});
    app.config.warnHandler = function (msg, inst, trace) {
      (window.__VUE_WARNS = window.__VUE_WARNS || []).push(String(msg).slice(0, 200));
      console.warn('[vue-warn]', msg);
    };
    app.config.errorHandler = function (err) {
      (window.__VUE_ERRORS = window.__VUE_ERRORS || []).push(String(err).slice(0, 200));
    };
    NexusComponents.register(app);
    app.mount('#app');
    window.__E2E_READY = true;
  </script>
</body>
</html>
